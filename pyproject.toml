[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    "gym_pledge/00_Archive",
    "gym_pledge/gym_kitty_analysis.ipynb",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
# Pragmatic starter set — enable the high-signal rules without forcing a
# big-bang cleanup of the existing codebase.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function calls in argument defaults are common in Streamlit code
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # tests insert sys.path before importing app modules
"gym_pledge/dashboard.py" = ["E402"]  # dashboard tweaks sys.path-like state before imports

[tool.ruff.lint.isort]
known-first-party = ["app_time", "config", "data", "ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config --cov=data --cov=config --cov-branch --cov-report=term-missing --cov-fail-under=75"

[tool.coverage.run]
# `data` and `config` resolve to gym_pledge/data and gym_pledge/config because
# tests insert gym_pledge/ onto sys.path themselves (see top of any tests/*.py).
# Coverage starts before pytest collection so it sees the same import names.
branch = true
source = ["data", "config"]

[tool.coverage.report]
# Surface partial-branch misses in the terminal report.
show_missing = true
skip_covered = false
