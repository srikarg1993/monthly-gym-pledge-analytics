name: ci

on:
  push:
    branches: [main, p2f]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Create venv and install deps
        run: |
          uv venv
          uv pip install -r requirements-dev.txt

      - name: Lint
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest

  audit:
    # Dependency vulnerability scan (adversarial P2-15). Runs in parallel
    # with `test` and `pre-commit`. Treat findings as advisory for now —
    # we do not gate merges on a moving CVE feed for a private app.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit production dependencies
        run: pip-audit -r requirements.txt --strict --disable-pip
        continue-on-error: true

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
