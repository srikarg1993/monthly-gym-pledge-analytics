name: ci

on:
  push:
    branches: [main, p2f]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Create venv and install deps
        run: |
          uv venv
          uv pip install -r requirements-dev.txt

      - name: Lint
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest
