name: stale

on:
  schedule:
    # Daily at 09:00 UTC (~ 04:00 America/Chicago)
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          # Issues: warn after 60 days idle, close after 14 more.
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-label: stale
          stale-issue-message: >
            This issue has been idle for 60 days. It will be closed in 14 days
            unless there is new activity. Comment to keep it open.
          close-issue-message: >
            Closing as stale. Reopen if this is still relevant.

          # PRs: warn after 30 days idle, close after 14 more.
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-pr-label: stale
          stale-pr-message: >
            This PR has been idle for 30 days. It will be closed in 14 days
            unless updated. Push a commit or comment to keep it open.
          close-pr-message: >
            Closing as stale. Reopen if you want to pick it back up.

          # Don't touch security-related items or pinned discussions.
          exempt-issue-labels: "security,pinned,roadmap"
          exempt-pr-labels: "security,pinned,WIP"
          exempt-draft-pr: true
